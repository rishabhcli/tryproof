<!doctype html>
<meta charset="utf-8">
<title>TryProof demo stage</title>
<style>
  html,body{margin:0;height:100%;background:#f7f4ef;font:16px/1.4 ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;color:#1d1b20;overflow:hidden}
  .wrap{display:grid;grid-template-columns:1fr 600px;gap:60px;align-items:center;height:100vh;padding:0 110px 0 130px;box-sizing:border-box}
  .brand{font-weight:700;font-size:28px;letter-spacing:-.01em;display:flex;align-items:center;gap:12px;margin-bottom:40px}
  .mark{width:34px;height:34px;border-radius:50%;background:conic-gradient(#0f6b63 0 70%,#d9d2c7 0);position:relative}
  .mark:after{content:"";position:absolute;inset:9px;border-radius:50%;background:#f7f4ef}
  .step{font-size:20px;color:#0f6b63;font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin-bottom:14px}
  h1{font-size:64px;line-height:1.08;margin:0 0 22px;letter-spacing:-.02em}
  p{font-size:26px;color:#4a4650;max-width:760px;margin:0}
  .api{margin-top:36px;display:flex;gap:10px;flex-wrap:wrap}
  .api span{background:#fff;border:1px solid #e6e0d8;border-radius:99px;padding:8px 16px;font-size:20px;font-family:ui-monospace,Menlo,monospace}
  .phone{width:600px;height:1000px;border-radius:54px;background:#111;padding:16px;box-sizing:border-box;box-shadow:0 30px 80px rgba(0,0,0,.25)}
  iframe{width:100%;height:100%;border:0;border-radius:40px;background:#fff}
  .note{position:fixed;bottom:22px;left:130px;font-size:17px;color:#6b6670}
</style>
<div class="wrap">
  <div>
    <div class="brand"><span class="mark"></span>TryProof</div>
    <div class="step" id="s">Step</div>
    <h1 id="t">Title</h1>
    <p id="d"></p>
    <div class="api" id="a"></div>
  </div>
  <div class="phone"><iframe id="app" src="" allow="clipboard-write"></iframe></div>
</div>
<div class="note">Sample faces are AI-generated. Screen recording of the deployed web app.</div>
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById('app').src = q.get('u');
  window.setCaption = (s, t, d, apis) => {
    document.getElementById('s').textContent = s; document.getElementById('t').textContent = t; document.getElementById('d').textContent = d || '';
    document.getElementById('a').replaceChildren(...(apis || []).map((x) => Object.assign(document.createElement('span'), { textContent: x })));
  };
</script>
